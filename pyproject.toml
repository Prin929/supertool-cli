[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supertool-cli"
version = "0.1.0"
description = "A production-grade CLI suite for path operations, task execution, data transformation, and configuration management."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ibeh Emmanuel", email = "emmacibeh.com" }]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/YOUR_GITHUB_USERNAME/supertool-cli"
"Bug Tracker" = "https://github.com/YOUR_GITHUB_USERNAME/supertool-cli/issues" 

[project.scripts]
supertool = "supertool.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
