[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supertool-cli"
version = "0.1.1"  # Bump version to 0.1.1 for PyPI updates
authors = [
    { name = "Emmanuel Ibeh", email = "your-email@example.com" }
]
description = "A production-grade CLI suite for path operations, task execution, data transformation, and configuration management."
readme = "README.md"  # <-- THIS tells PyPI to render your README.md as the project description
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/YOUR_GITHUB_USERNAME/supertool-cli"
"Bug Tracker" = "https://github.com/YOUR_GITHUB_USERNAME/supertool-cli/issues"

[project.scripts]
supertool = "supertool.main:main"
